---
# ============================================================
# playbook.yml — Deploy Court Hearing Reminder Portal
#
# Prerequisites on the CONTROLLER (not target):
#   - Ansible 2.12+  (Linux/WSL — Ansible does NOT run natively on Windows)
#   - SSH key configured for the target host
#
# Usage:
#   ansible-playbook -i ansible/inventory ansible/playbook.yml \
#     -e "image_tag=1.0.1" \
#     -e "docker_hub_username=yourusername" \
#     --ask-vault-pass          # if using ansible-vault for passwords
#
# Idempotency: running twice produces changed=0 on second run.
# ============================================================
- name: Deploy Court Hearing Reminder Portal
  hosts: court_servers
  become: true
  gather_facts: true

  tasks:
    # ── 1. System prerequisites ──────────────────────────────
    - name: Update apt cache (Debian/Ubuntu)
      apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install required packages
      package:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - python3-pip
        state: present

    # ── 2. Install Docker ────────────────────────────────────
    - name: Add Docker GPG key (Debian/Ubuntu)
      apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        state: present
      when: ansible_os_family == "Debian"

    - name: Add Docker repository (Debian/Ubuntu)
      apt_repository:
        repo: "deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present
      when: ansible_os_family == "Debian"

    - name: Install Docker Engine
      package:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-compose-plugin
        state: present

    - name: Ensure Docker service is started and enabled
      service:
        name: docker
        state: started
        enabled: true

    - name: Install docker Python SDK (for ansible docker modules)
      pip:
        name: docker
        state: present

    # ── 3. Create application directory ─────────────────────
    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"
        owner: root
        group: root

    # ── 4. Template configuration files ─────────────────────
    - name: Template .env file
      template:
        src: templates/env.j2
        dest: "{{ app_dir }}/.env"
        mode: "0600"   # owner-only read
        owner: root
        group: root
      notify: Restart app

    - name: Template docker-compose.yml
      template:
        src: templates/docker-compose.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: "0644"
        owner: root
        group: root
      notify: Restart app

    # ── 5. Pull Docker images ────────────────────────────────
    - name: Pull backend image
      community.docker.docker_image:
        name: "{{ docker_hub_username }}/court-backend"
        tag: "{{ image_tag }}"
        source: pull
        force_source: true

    - name: Pull frontend image
      community.docker.docker_image:
        name: "{{ docker_hub_username }}/court-frontend"
        tag: "{{ image_tag }}"
        source: pull
        force_source: true

    # ── 6. Start services via Docker Compose ─────────────────
    - name: Start application with docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        files:
          - docker-compose.yml
        state: present
        pull: never   # already pulled above
      environment:
        DOCKER_HOST: unix:///var/run/docker.sock

    # ── 7. Wait for backend to become healthy ────────────────
    - name: Wait for backend health endpoint
      uri:
        url: "http://localhost:{{ backend_port }}/api/health"
        status_code: 200
        timeout: 10
      register: health_result
      retries: 20
      delay: 5
      until: health_result.status == 200

    - name: Print health result
      debug:
        msg: "Backend is healthy: {{ health_result.json }}"

  handlers:
    - name: Restart app
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        files:
          - docker-compose.yml
        state: restarted
