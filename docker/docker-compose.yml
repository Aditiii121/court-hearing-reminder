services:
  # ------------------------------------------------------------------ MySQL
  mysql:
    image: mysql:8.0
    container_name: court-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-courtdb}
      MYSQL_USER: ${DB_USERNAME:-courtuser}
      MYSQL_PASSWORD: ${DB_PASSWORD:-courtpass}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - court-net

  # ----------------------------------------------------------------- Backend
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: ${DOCKER_HUB_USERNAME:-local}/court-backend:${IMAGE_TAG:-1.0.0}
    container_name: court-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-courtdb}
      DB_USERNAME: ${DB_USERNAME:-courtuser}
      DB_PASSWORD: ${DB_PASSWORD:-courtpass}
      JWT_SECRET: ${JWT_SECRET:-pleasechangethissecret256bitslong!!}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - court-net

  # ---------------------------------------------------------------- Frontend
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: ${DOCKER_HUB_USERNAME:-local}/court-frontend:${IMAGE_TAG:-1.0.0}
    container_name: court-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - court-net

volumes:
  mysql-data:
    driver: local

networks:
  court-net:
    driver: bridge
