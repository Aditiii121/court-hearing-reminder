name: Court Hearing Reminder Portal — CI

on:
  push:
    branches: [ main, development ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── Backend: Build + Test ───────────────────────────────────────────────────
  backend:
    name: Backend (Java 17 + Maven)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Backend — compile
        working-directory: backend
        run: mvn clean compile -B -DskipTests

      - name: Backend — run tests (JUnit 5 + H2 in-memory)
        working-directory: backend
        run: mvn test -B

      - name: Backend — package JAR
        working-directory: backend
        run: mvn package -B -DskipTests

      - name: Publish backend JUnit test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: backend/target/surefire-reports/TEST-*.xml
          check_name: Backend Test Results
          fail_on_failure: true

      - name: Archive backend JAR
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: court-backend-jar
          path: backend/target/court-hearing-backend-*.jar
          retention-days: 7

  # ─── Frontend: Install + Test + Build ────────────────────────────────────────
  frontend:
    name: Frontend (Node 22 + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend — run tests (Node test runner + JUnit XML)
        working-directory: frontend
        run: npm test

      - name: Publish frontend JUnit test results
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: frontend/test-results/test-results.xml
          check_name: Frontend Test Results
          fail_on_failure: true

      - name: Frontend — production build (Vite)
        working-directory: frontend
        run: npm run build

      - name: Archive frontend production build
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: court-frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ─── Docker: Build Images ────────────────────────────────────────────────────
  docker:
    name: Docker Build (verify images build)
    runs-on: ubuntu-latest
    needs: [ backend, frontend ]
    # Only build images on pushes to main (not on pull requests)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: local/court-backend:1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: local/court-frontend:1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify images built
        run: |
          docker images local/court-backend:1.0.0
          docker images local/court-frontend:1.0.0
          echo "Both images built successfully."
