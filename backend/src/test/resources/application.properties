# H2 in-memory database for unit tests ONLY
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT for tests
jwt.secret=test_secret_key_at_least_32_characters_long_for_testing

# Disable reminder scheduler in tests
reminder.schedule.rate=999999999
reminder.schedule.initialDelay=999999999

logging.level.com.court.hearing=WARN
